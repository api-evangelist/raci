name: RACI
description: >-
  A responsibility assignment matrix that defines roles and responsibilities
  using four key designations - Responsible (those who do the work),
  Accountable (the ultimate decision maker), Consulted (those whose input is
  needed), and Informed (those who need to be kept updated). RACI matrices
  help clarify ownership, reduce confusion, and improve project coordination
  by mapping stakeholders to specific tasks or deliverables.
